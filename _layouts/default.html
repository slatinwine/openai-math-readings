<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
html{background:#fff;color-scheme:light}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;max-width:52em;margin:0 auto;padding:1em 1.4em;line-height:1.75;color:#1c1e21;background:#fff}
nav{border-bottom:1px solid #ddd;padding:.4em 0;margin-bottom:1.2em;font-size:.95em}
nav a{margin-right:1.2em;text-decoration:none;color:#0b5fff}
h1{font-size:1.45em;line-height:1.4}
h2{font-size:1.18em;border-left:4px solid #0b5fff;padding-left:.5em;margin-top:1.6em}
blockquote{border-left:4px solid #c8d3e8;margin:0;padding:.2em 1em;color:#444;background:#f6f8fb}
table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:.3em .6em}
code{background:#f4f4f6;padding:.1em .3em;border-radius:3px}
.meta{color:#666;font-size:.9em}
svg{max-width:100%;height:auto;display:block;margin:.8em auto;background:#fafbfd;border:1px solid #e3e8f0;border-radius:8px;padding:8px}
footer{margin-top:2.5em;border-top:1px solid #ddd;padding-top:.6em;color:#888;font-size:.85em}
</style>
</head>
<body>
<nav><a href="{{ site.baseurl }}/index.html">首页·总览</a><a href="{{ site.baseurl }}/catalog.html">722 篇总目录</a><a href="https://github.com/slatinwine/openai-math-readings">GitHub 仓库</a></nav>
{{ content }}
{% if page.source %}<footer>原文手稿：<a href="{{ page.source }}">openai/math · {{ page.pdfname }}</a>（Apache-2.0）</footer>{% endif %}
<script>
(function(){
  var tries = 0;
  function rm(){
    if (!window.katex) return false;
    document.querySelectorAll('code').forEach(function(c){
      var t = c.textContent;
      if (t.indexOf('@@M@@') !== 0 || t.slice(-2) !== '@@') return;
      var isD = t.indexOf('@@M@@D') === 0;
      var tex = isD ? t.slice(6, -2) : t.slice(5, -2);
      var el = document.createElement(isD ? 'div' : 'span');
      try { katex.render(tex, el, {throwOnError: false, displayMode: isD}); }
      catch(e) { el.textContent = tex; }
      c.parentNode.replaceChild(el, c);
    });
    return true;
  }
  window.__mathKatex = 'armed';
  if (!rm()) {
    var iv = setInterval(function(){ if (rm() || ++tries > 100) clearInterval(iv); }, 200);
  }
})();
</script>
</body>
</html>
